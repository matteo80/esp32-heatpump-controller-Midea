substitutions:
  devicename: heatpump
  description: Heatpump
  entity_prefix: Heatpump

globals:
  - id: unmasked_value_water_temperature_t1s
    type: int
    restore_value: no
    initial_value: '0'

  # Logica ritorno olio
  - id: temp_originale_setpoint
    type: float
    restore_value: no
    initial_value: '25.0'

esphome:
  name: "${devicename}"
  comment: "${description}"
  friendly_name: "${description}"

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:
    level: DEBUG
    baud_rate: 0

# Enable Home Assistant API
api:
  encryption:
    key: "5QdE+vB8Iaefbfj0v9f3BpchcljfYT+XOkNKGYzNTvQ="

ota:
  - platform: esphome
    password: "a62383cc2af51400bb8d42df62c2688e"

# Add webserver on port 80
#web_server:
  #port: 80

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  #use_address: 192.168.1.106
  manual_ip:
    static_ip: 192.168.1.13
    gateway: 192.168.1.1
    subnet: 255.255.255.0
    dns1: 192.168.1.14

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Heatpump Fallback Hotspot"
    password: "heatpump"

captive_portal:

uart:
  id: mod_bus
  tx_pin: 17
  rx_pin: 16
  baud_rate: 9600
  stop_bits: 1 # (prima dell'aggiornamento era 1)
  parity: NONE
  rx_buffer_size: 512 # nuovo
  debug:              # nuovo
    direction: BOTH   # nuovo
    dummy_receiver: false  # nuovo

modbus:
  id: modbus1
  uart_id: mod_bus
  send_wait_time: 200ms # nuovo

modbus_controller:
  - id: "${devicename}"
    address: 0x10   ## address of the ModBUS slave device on the bus
    modbus_id: modbus1
    setup_priority: -10
    update_interval: 10s

sensor:
  - platform: wifi_signal
    name: "WiFi Signal Heatpump"
    update_interval: 60s

  # Temperatura interna del chip ESP32 (utile per vedere se sta faticando)
  - platform: internal_temperature
    name: "${devicename} Temperatura Interna"

  # Uptime (Tempo di attività)
  - platform: uptime
    name: "${devicename} Uptime"
    id: uptime_sensor

  # Registro 0 - on_off
  - platform: modbus_controller
    modbus_controller_id: "${devicename}"
    name: "on_off"
    id: on_off
    register_type: holding
    address: 0
    value_type: U_WORD

  # Registro 5 - Function setting
  - platform: modbus_controller
    modbus_controller_id: "${devicename}"
    name: "Function setting"
    id: function_setting
    register_type: holding
    address: 5
    value_type: U_WORD

  # Registro 100 - Frequenza compressore
  - platform: modbus_controller
    modbus_controller_id: "${devicename}"
    name: "Frequenza compressore"
    id: frequenza_compressore
    register_type: holding
    address: 100
    value_type: U_WORD
    unit_of_measurement: Hz

  # Registro 101 - Operating mode
  - platform: modbus_controller
    modbus_controller_id: "${devicename}"
    name: "Operating mode"
    id: operating_mode
    register_type: holding
    address: 101
    value_type: U_WORD

  # Registro 102 - Fan speed
  - platform: modbus_controller
    modbus_controller_id: "${devicename}"
    name: "Fan speed"
    id: fan_speed
    register_type: holding
    address: 102
    value_type: U_WORD
    unit_of_measurement: "r/min"
    icon: mdi:fan

  # Registro 103 - Valvola di espansione
  - platform: modbus_controller
    modbus_controller_id: "${devicename}"
    name: "Valvola di espansione"
    id: valvola_di_espansione
    register_type: holding
    address: 103
    value_type: U_WORD
    unit_of_measurement: "Pa"

  # Registro 107 - Temperatura esterna    
  - platform: modbus_controller
    modbus_controller_id: "${devicename}"
    name: "Temperatura esterna"
    id: temperatura_esterna
    register_type: holding
    address: 107
    value_type: S_WORD
    unit_of_measurement: "°C"

  
  # Registro 116 - Pressione gas
  - platform: modbus_controller
    modbus_controller_id: "${devicename}"
    name: "Pressione gas"
    id: pressione_gas
    register_type: holding
    address: 116
    value_type: U_WORD
    unit_of_measurement: "kPa"

  # Registro 119 - Voltaggio PDC bus
  - platform: modbus_controller
    modbus_controller_id: "${devicename}"
    name: "Voltaggio PDC bus"
    id: voltaggio_PDC_bus
    register_type: holding
    address: 119
    value_type: U_WORD
    unit_of_measurement: V

  # Registro 122 - Funzionamento compressore
  - platform: modbus_controller
    modbus_controller_id: "${devicename}"
    name: "Funzionamento compressore"
    id: funzionamento_compressore
    register_type: holding
    address: 122
    value_type: U_WORD
    unit_of_measurement: ore

# Register: 124 - Current Fault
  - platform: modbus_controller
    modbus_controller_id: "${devicename}"
    name: "Current Fault"
    id: "${devicename}_current_fault"
    register_type: holding
    entity_category: diagnostic
    address: 0x7c
    value_type: U_WORD
    icon: mdi:alert-circle

  # Registro 133 - Dc bus current    
  - platform: modbus_controller
    modbus_controller_id: "${devicename}"
    name: "Dc bus current"
    id: dc_bus_current
    register_type: holding
    address: 133
    value_type: U_WORD
    unit_of_measurement: A

  # Registro 134 - Dc bus voltage    
  - platform: modbus_controller
    modbus_controller_id: "${devicename}"
    name: "Dc bus voltage"
    id: dc_bus_voltage
    register_type: holding
    address: 134
    value_type: U_WORD
    unit_of_measurement: V
    filters:
      - multiply: 10

  # Registro 136 - Calcolo curva climatica zona 1    
  - platform: modbus_controller
    modbus_controller_id: "${devicename}"
    name: "Calcolo curva climatica zona 1"
    id: calcolo_curva_climatica_zona_1
    register_type: holding
    address: 136
    value_type: U_WORD
    unit_of_measurement: "°C"

  # Registro 265 - T1setH1    
  - platform: modbus_controller
    modbus_controller_id: "${devicename}"
    name: "T1setH1"
    id: T1setH1
    register_type: holding
    address: 265
    value_type: U_WORD
    unit_of_measurement: "°C"

  # Registro 266 - T1setH2    
  - platform: modbus_controller
    modbus_controller_id: "${devicename}"
    name: "T1setH2"
    id: T1setH2
    register_type: holding
    address: 266
    value_type: U_WORD
    unit_of_measurement: "°C"

  # Registro 267 - T4H1    
  - platform: modbus_controller
    modbus_controller_id: "${devicename}"
    name: "T4H1"
    id: T4H1
    register_type: holding
    address: 267
    value_type: S_WORD
    unit_of_measurement: "°C"

  # Registro 268 - T4H2    
  - platform: modbus_controller
    modbus_controller_id: "${devicename}"
    name: "T4H2"
    id: T4H2
    register_type: holding
    address: 268
    value_type: S_WORD
    unit_of_measurement: "°C"

switch:
  - platform: restart
    name: "Restart"

binary_sensor:
  # Registro 128 Bit:1 - Defrost
  - platform: modbus_controller
    modbus_controller_id: "${devicename}"
    name: "Defrost"
    id: defrost
    register_type: holding
    address: 128
    bitmask: 2
  
  # Registro 128 Bit:2 - Anti-freezing
  - platform: modbus_controller
    modbus_controller_id: "${devicename}"
    name: "Anti-freezing"
    id: anti_freezing
    register_type: holding
    address: 128
    bitmask: 4

#  # Registro 128 Bit:3 - Ritorno olio
#  - platform: modbus_controller
#    modbus_controller_id: "${devicename}"
#    name: "Ritorno olio"
#    id: ritorno_olio
#    register_type: holding
#    address: 128
#    bitmask: 8

   # Registro 128 Bit:3 - Ritorno olio con automatismo
  - platform: modbus_controller
    modbus_controller_id: "${devicename}"
    name: "Ritorno Olio"
    id: ritorno_olio
    register_type: holding
    address: 128
    bitmask: 8

    on_press:
          then:
            - if:
                condition:
                  # Controlla che la climatica sia spenta prima di procedere
                  lambda: 'return id(curve_enable).current_option() == "Spenta";'
                then:
                  - if:
                      condition:
                        lambda: 'return id(setting_mode).current_option() == "Cool";'
                      then:
                        - lambda: |-
                            id(temp_originale_setpoint) = id(heatpump_set_water_temperature_t1s_zone_1).state;
                            ESP_LOGD("PDC_LOG", "Ritorno olio (Cool). Salvo setpoint: %.1f", id(temp_originale_setpoint));
                        - number.set:
                            id: heatpump_set_water_temperature_t1s_zone_1
                            value: 10
                      else:
                        - if:
                            condition:
                              lambda: 'return id(setting_mode).current_option() == "Heat";'
                            then:
                              - lambda: |-
                                  id(temp_originale_setpoint) = id(heatpump_set_water_temperature_t1s_zone_1).state;
                                  ESP_LOGD("PDC_LOG", "Ritorno olio (Heat). Salvo setpoint: %.1f", id(temp_originale_setpoint));
                              - number.set:
                                  id: heatpump_set_water_temperature_t1s_zone_1
                                  value: !lambda "return id(temp_originale_setpoint) + 5.0;"
                else:
                  - logger.log: "Ritorno olio attivo, ma climatica attiva: nessuna modifica al setpoint."

    on_release:
          then:
            - if:
                condition:
                  # Ripristina solo se la climatica è spenta E siamo in una modalità valida
                  lambda: |-
                    return (id(curve_enable).current_option() == "Spenta") && 
                           (id(setting_mode).current_option() == "Cool" || id(setting_mode).current_option() == "Heat");
                then:
                  - logger.log: "Fine ritorno olio. Attendo 60 secondi..."
                  - delay: 60s
                  - number.set:
                      id: heatpump_set_water_temperature_t1s_zone_1
                      value: !lambda "return id(temp_originale_setpoint);"
                  - logger.log: "Setpoint ripristinato."

  # Registro 129 Bit: 4 - Load Output SV 1
  - platform: modbus_controller
    modbus_controller_id: "${devicename}"
    name: "Load Output SV 1"
    id: "load_output_sv1"
    register_type: holding
    address: 0x81
    bitmask: 0x10

  # Registro 129 Bit: 13 - Load Output RUN
  - platform: modbus_controller
    modbus_controller_id: "${devicename}"
    name: "Load Output RUN"
    id: "load_output_run"
    register_type: holding
    address: 129
    bitmask: 2000

text_sensor:
  - platform: version
    name: "ESPHome Version"
    hide_timestamp: true

  # Active State
  - platform: template
    name: "Active State"
    id: "active_state"
    lambda: |-
      if (id(load_output_run).state) {
        // The heat pump is on
        if (id(defrost).state) {
          return {"Defrosting"};
        } else if (id(load_output_sv1).state) {
          return {"DHW"};
        } else if (id(anti_freezing).state) {
          return {"Anti-freezing"};
        } else if (id(ritorno_olio).state) {
          return {"Ritorno olio"};
        } else {
          if (id(operating_mode).state == 3) {
            return {"Riscaldamento"};
          } else if (id(operating_mode).state == 2) {
            return {"Raffreddamento"};
          } else {
            return {"Sconosciuto"};
          }
        }
      } else {
        // The heat pump is off
        return {"Spento"};
      }

  - platform: template
    name: "${devicename} Uptime Formattato"
    icon: mdi:clock-start
    lambda: |-
      uint32_t dur = id(uptime_sensor).state;
      int days = dur / 86400;
      int hours = (dur % 86400) / 3600;
      int mins = (dur % 3600) / 60;
      return str_sprintf("%dd %dh %dm", days, hours, mins);
    update_interval: 60s

number:
  # Register: 2 (Zone 1, Low)
  - platform: modbus_controller
    modbus_controller_id: "${devicename}"
    name: "Set Water Temperature T1S Zone 1"
    id: "${devicename}_set_water_temperature_t1s_zone_1"
    register_type: holding
    address: 0x2
    value_type: U_WORD
    unit_of_measurement: "°C"
    entity_category: config
    min_value: 5
    max_value: 60
    step: 1  # <--- Questo toglierà i decimali in Home Assistant
    mode: box
    lambda: |-
      // Update the global var unmasked_value_water_temperature_t1s
      id(unmasked_value_water_temperature_t1s) = x;

      // ESP_LOGI("","unmasked_value_water_temperature_t1s: %d",id(unmasked_value_water_temperature_t1s));

      uint8_t value_bytes[2];
      uint16_t value = x;
      value_bytes[0] = value >> 8;     // high byte (zone 2)
      value_bytes[1] = value & 0x00FF; // low byte (zone 1)

      // ESP_LOGI("","Zone 1 is %d", value_bytes[1]);
      // ESP_LOGI("","Zone 2 is %d", value_bytes[0]);

      return value_bytes[1];
    write_lambda: |-
      uint16_t value = id(unmasked_value_water_temperature_t1s); // The original unmasked value
      uint8_t value_byte = (uint8_t)x; // Prendiamo la parte intera del nuovo valore   // New byte value with the new temp for zone 1 // originale  uint8_t value_byte = x;

      value &= 0xFF00;      // Clear the lower byte of the value
      value |= value_byte;  // Update the lower byte with the new byte value

      // ESP_LOGI("main", "Original value: %d", id(unmasked_value_water_temperature_t1s));
      // ESP_LOGI("main", "New value: %d", value);

      esphome::modbus_controller::ModbusCommandItem set_payload_command = esphome::modbus_controller::ModbusCommandItem::create_write_single_command(${devicename}, 0x2, value);
      ${devicename}->queue_command(set_payload_command);

      return {};

select:
  # Register: 1
  - platform: modbus_controller
    modbus_controller_id: "${devicename}"
    name: "Setting mode"
    id: setting_mode
    icon: "mdi:fan"
    address: 0x1
    value_type: U_WORD
    optimistic: true
    optionsmap:
      "Heat": 3
      "Cool": 2
      "Auto": 1


  # Registro 0 - Selezione power on_off
  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: "${devicename}"
    name: "Heat pump on_off switch"
    id: select_power_on_off
    address: 0
    value_type: U_WORD
    optionsmap:
      "OFF": 0
      "ON": 2
    lambda: |-
      //ESP_LOGE("main","Modbus Number incoming value = %d",x);
      //ESP_LOGE("main","Modbus eval value = %d",(x & 0x0002));
      if ((x & 0x0002) == 0)
        return  std::string("OFF");
      if ((x & 0x0002) == 2)
        return  std::string("ON");
      return {};
    write_lambda: |-
      //ESP_LOGE("main","Modbus write gets = %d",value);
      uint16_t unmodified =  id(on_off).state;
      //ESP_LOGE("main","Modbus write unmodified = %d", unmodified);
      uint16_t modified = ((unmodified & ~0x0002) | value);
      //ESP_LOGE("main","Modbus write to write = %d", modified);
      return modified;

    # Registro 5 Bit 6 - Silent mode
  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: "${devicename}"
    name: "Silent mode"
    id: silent_mode
    address: 5
    value_type: U_WORD
    optionsmap:
      "OFF": 0
      "ON": 64
    lambda: |-
      //ESP_LOGE("main","Modbus Number incoming value = %d",x);
      //ESP_LOGE("main","Modbus eval value = %d",(x & 0x0040));
      if ((x & 0x0040) == 0)
        return  std::string("OFF");
      if ((x & 0x0040) == 64)
        return  std::string("ON");
      return {};
    write_lambda: |-
      //ESP_LOGE("main","Modbus write gets = %d",value);
      uint16_t unmodified =  id(function_setting).state;
      //ESP_LOGE("main","Modbus write unmodified = %d", unmodified);
      uint16_t modified = ((unmodified & ~0x0040) | value);
      //ESP_LOGE("main","Modbus write to write = %d", modified);
      return modified;

    # Registro 5 Bit 12 - Curve enable
  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: "${devicename}"
    name: "Curve enable"
    id: curve_enable
    address: 5
    value_type: U_WORD
    optionsmap:
      "Spenta": 0
      "Attiva": 4096
    lambda: |-
      //ESP_LOGE("main","Modbus Number incoming value = %d",x);
      //ESP_LOGE("main","Modbus eval value = %d",(x & 0x1000));
      if ((x & 0x1000) == 0)
        return  std::string("Spenta");
      if ((x & 0x1000) == 4096)
        return  std::string("Attiva");
      return {};
    write_lambda: |-
      //ESP_LOGE("main","Modbus write gets = %d",value);
      uint16_t unmodified =  id(function_setting).state;
      //ESP_LOGE("main","Modbus write unmodified = %d", unmodified);
      uint16_t modified = ((unmodified & ~0x1000) | value);
      //ESP_LOGE("main","Modbus write to write = %d", modified);
      return modified;
